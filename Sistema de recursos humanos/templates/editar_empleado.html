<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h2>Editar Empleado</h2>

    <form method="POST">
        <input type="text" name="nombre" value="{{ empleado.nombre }}" required class="form-control mb-2"><br>
        <input type="text" name="apellido" value="{{ empleado.apellido }}" required class="form-control mb-2"><br>
        <input type="text" name="cedula" value="{{ empleado.cedula }}" required class="form-control mb-2"><br>
        <input type="text" name="cargo" value="{{ empleado.cargo }}" class="form-control mb-2"><br>
        <input type="text" name="departamento" value="{{ empleado.departamento }}" class="form-control mb-2"><br>
        <input type="number" name="salario" value="{{ empleado.salario }}" step="1" class="form-control mb-2" min="0"><br>
        <input type="date" name="fecha_ingreso" value="{{ empleado.fecha_ingreso }}" class="form-control mb-2"><br>

        <select name="estado">
            <option value="Activo" {% if empleado.estado == 'Activo' %}selected{% endif %}>Activo</option>
            <option value="Inactivo" {% if empleado.estado == 'Inactivo' %}selected{% endif %}>Inactivo</option>
        </select><br><br>

        <button type="submit" class="btn btn-success">Guardar cambios</button>
        <a href="/empleados" class="btn btn-secondary">Cancelar</a>
    </form>

    
</div>

</body>
</html>
