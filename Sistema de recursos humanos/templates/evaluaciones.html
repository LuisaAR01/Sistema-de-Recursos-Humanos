<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">Evaluaciones</h2>
        </div>

        <div class="card-body">
            <form method="POST" class="row g-3">

                <div class="col-md-3">
                    <label class="form-label">Empleado</label>
                    <select name="empleado_id" class="form-select">
                        {% for emp in empleados %}
                        <option value="{{ emp[0] }}">{{ emp[1] }} {{ emp[2] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Fecha</label>
                    <input type="date" name="fecha" class="form-control">
                </div>

                <div class="col-md-2">
                    <label class="form-label">Puntuación</label>
                    <input type="number" name="puntuacion" class="form-control" placeholder="0-100">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Comentarios</label>
                    <input type="text" name="comentarios" class="form-control">
                </div>

                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-success w-100">Guardar</button>
                </div>

            </form>
        </div>
    </div>

    <div class="card shadow mt-4">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Lista de Evaluaciones</h5>
        </div>

        <div class="card-body table-responsive">
            <table class="table table-bordered table-hover text-center align-middle">
                <thead class="table-secondary">
                    <tr>
                        <th>Empleado</th>
                        <th>Fecha</th>
                        <th>Puntuación</th>
                        <th>Comentarios</th>
                    </tr>
                </thead>
                <tbody>
                    {% for ev in evaluaciones %}
                    <tr>
                        <td>{{ ev[0] }} {{ ev[1] }}</td>
                        <td>{{ ev[2] }}</td>
                        <td><span class="badge bg-info">{{ ev[3] }}</span></td>
                        <td>{{ ev[4] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <a href="/dashboard" class="btn btn-secondary">Volver</a>

</div>

</body>
</html>
