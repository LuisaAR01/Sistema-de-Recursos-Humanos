<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursos humanos | Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h2>Registro de Empleados</h2>

    <form method="POST" class="row g-3">
        <div class="col-md-6">
            <input type="text" name="nombre" class="form-control" placeholder="Nombre" required>
        </div>
        <div class="col-md-6">
            <input type="text" name="apellido" class="form-control" placeholder="Apellido" required>
        </div>
        <div class="col-md-4">
            <input type="text" name="cedula" class="form-control" placeholder="Cédula" required>
        </div>
        <div class="col-md-4">
            <input type="text" name="cargo" class="form-control" placeholder="Cargo">
        </div>
        <div class="col-md-4">
            <input type="text" name="departamento" class="form-control" placeholder="Departamento">
        </div>
        <div class="col-md-4">
            <input type="number" name="salario" class="form-control" placeholder="Salario" min="0">
        </div>
        <div class="col-md-4">
            <input type="date" name="fecha_ingreso" class="form-control">
        </div>
        <div class="col-md-4">
            <select name="estado" class="form-control">
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
            </select>
        </div>

        <div class="col-12">
            <button class="btn btn-primary">Guardar</button>
        </div>
    </form>


    <hr>

    <h2>Lista de Empleados</h2>
    <table class="table table-striped">
        <thead>
            <tr>
               <th>ID</th>
                <th>Nombre</th>
                <th>Cargo</th>
                <th>Departamento</th>
                <th>Salario</th>
                <th>Estado</th>
                <th>Acciones</th>             
        </tr>
        </thead>
        <tbody>             
        
            {% for emp in empleados %}
            <tr>
                <td>{{ emp.id }}</td>
                <td>{{ emp.nombre }} {{ emp.apellido }}</td>
                <td>{{ emp.cargo }}</td>
                <td>{{ emp.departamento }}</td>
                <td>{{ emp.salario }}</td>
                <td>{{ emp.estado }}</td>
                <td>
                    <a href="{{ url_for('editar_empleado', id=emp.id) }}" class="btn btn-warning btn-sm">Editar</a>
                    |
                    <a href="{{url_for('eliminar_empleado', id=emp.id) }}"onclick="return confirm('Seguro que deseas eliminar este empleado?')" class="btn btn-warning btn-sm">Eliminar</a>
                </td>
            </tr>
            {% endfor %}

        </tbody>

    </table>
    
</body>
</html>
