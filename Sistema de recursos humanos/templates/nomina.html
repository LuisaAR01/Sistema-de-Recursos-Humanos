<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recursos humanos | Nómina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h1>Gestión de Nómina</h1>

    <form method="POST">
        <select name="empleado_id" required>
            {% for emp in empleados %}
            <option value="{{ emp.id }}">
                {{ emp.nombre }} {{ emp.apellido }}
            </option>
            {% endfor %}
        </select><br>

        <input type="date" name="fecha" required><br><br>

        <button type="submit">Generar Nómina</button>
    </form>

    <hr>

    <h2>Nóminas Generadas</h2>

    <table class="table table-bordered">
        <tr>
            <th>Empleado</th>
            <th>Salario Base</th>
            <th>AFP</th>
            <th>SFS</th>
            <th>Salario Neto</th>
            <th>Fecha</th>
        </tr>

        {% for n in nominas %}
        <tr>
            <td>{{ n.nombre }} {{ n.apellido }}</td>
            <td>{{ n.salario_base }}</td>
            <td>{{ n.afp }}</td>
            <td>{{ n.sfs }}</td>
            <td>{{ n.salario_neto }}</td>
            <td>{{ n.fecha }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="/dashboard" class="btn btn-secondary">Volver</a>
</div>

</body>
</html>
