<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacitaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h2 class="mb-0">Capacitaciones</h2>
        </div>

        <div class="card-body">
            <form method="POST" class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" placeholder="Nombre">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Fecha</label>
                    <input type="date" name="fecha" class="form-control">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Estado</label>
                    <input type="text" name="estado" class="form-control" placeholder="Pendiente / Completado">
                </div>

                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-primary w-100">Guardar</button>
                </div>

            </form>
        </div>
    </div>

    <div class="card shadow mt-4">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Lista de Capacitaciones</h5>
        </div>

        <div class="card-body table-responsive">
            <table class="table table-striped table-hover text-center align-middle">
                <thead class="table-secondary">
                    <tr>
                        <th>Nombre</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    {% for c in capacitaciones %}
                    <tr>
                        <td>{{ c[1] }}</td>
                        <td>{{ c[2] }}</td>
                        <td>
                            <span class="badge bg-warning text-dark">{{ c[3] }}</span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <a href="/dashboard" class="btn btn-secondary">Volver</a>

</div>

</body>
</html>
