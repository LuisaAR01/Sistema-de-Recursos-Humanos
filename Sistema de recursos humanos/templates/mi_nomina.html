<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Nómina</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">
    <h2>Mi Nómina</h2>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Salario Base</th>
                <th>AFP</th>
                <th>SFS</th>
                <th>Salario Neto</th>
            </tr>
        </thead>

        <tbody>
            {% for n in nomina %}
            <tr>
                <td>{{ n[4] }}</td>
                <td>{{ n[0] }}</td>
                <td>{{ n[1] }}</td>
                <td>{{ n[2] }}</td>
                <td>{{ n[3] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/dashboard" class="btn btn-secondary">Volver</a>
</div>

</body>
</html>
